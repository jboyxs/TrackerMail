<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracker admin</title>
<style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:1rem;background:#f5f6f8}main{background:white;padding:1.5rem;border-radius:12px}input,button{font:inherit;padding:.55rem;margin:.3rem 0}input{width:100%;box-sizing:border-box}button{cursor:pointer;background:#2563eb;color:#fff;border:0;border-radius:5px}.row{display:flex;gap:1rem}.row>*{flex:1}#result{white-space:pre-wrap;background:#eef6ff;padding:1rem;margin-top:1rem;word-break:break-word}.muted{color:#667085}</style>
<main><h1>Tracker admin</h1><p class="muted">Create users and issue API tokens. A token is shown only once.</p>
<form id="login"><div class="row"><label>Admin username<input id="admin-user" value="jjboy" required></label><label>Admin password<input id="admin-pass" type="password" required></label></div><button>Login</button></form>
<section id="panel" hidden><h2>Create user</h2><form id="create"><label>Username<input id="new-user" pattern="[A-Za-z0-9_.@-]+" required></label><button>Create user and token</button></form><pre id="result"></pre><h2>Users</h2><button id="refresh" type="button">Refresh users</button><ul id="users"></ul></section></main>
<script>let auth="";const $=id=>document.getElementById(id);async function api(path,options={}){const response=await fetch(path,{...options,headers:{...(options.headers||{}),Authorization:auth,"Content-Type":"application/json"}});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.detail||`HTTP ${response.status}`);return data}function result(text){$("result").textContent=text}$("login").addEventListener("submit",async e=>{e.preventDefault();auth="Basic "+btoa($("admin-user").value+":"+$("admin-pass").value);try{await api("/api/admin/users");$("panel").hidden=false;result("Authenticated.");loadUsers()}catch(error){auth="";result(error.message)}});$("create").addEventListener("submit",async e=>{e.preventDefault();try{const data=await api("/api/admin/users",{method:"POST",body:JSON.stringify({username:$("new-user").value})});result(`User: ${data.username}\nToken (copy now):\n${data.token}`);$("new-user").value="";loadUsers()}catch(error){result(error.message)}});async function loadUsers(){try{$("users").innerHTML="";(await api("/api/admin/users")).forEach(user=>{const li=document.createElement("li");li.textContent=`${user.username} — ${new Date(user.created_at).toLocaleString()} — ${user.disabled?"disabled":"active"} `;if(!user.disabled){const button=document.createElement("button");button.textContent="Disable";button.onclick=async()=>{if(confirm(`Disable ${user.username}?`)){try{await api(`/api/admin/users/${user.id}`,{method:"DELETE"});loadUsers()}catch(error){result(error.message)}}};li.append(button)}$("users").append(li)})}catch(error){result(error.message)}}$("refresh").addEventListener("click",loadUsers)</script>
