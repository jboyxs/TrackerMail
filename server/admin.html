<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracker Admin</title>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;--bg:#f2f2f7;--card:rgba(255,255,255,.82);--text:#1c1c1e;--muted:#6e6e73;--line:#d1d1d6;--blue:#007aff;--red:#ff3b30;--green:#34c759;--shadow:0 16px 42px #00000012}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:rgba(28,28,30,.9);--text:#f2f2f7;--muted:#98989f;--line:#38383a;--shadow:0 16px 42px #00000055}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#dbeafe 0,#var(--bg) 38%);color:var(--text)}
.shell{max-width:880px;margin:0 auto;padding:48px 20px 72px}.brand{display:flex;align-items:center;gap:13px;margin-bottom:28px}.brand-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--blue);color:#fff;font-size:23px;box-shadow:0 8px 18px #007aff44}.eyebrow{margin:0;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}.brand h1{margin:3px 0 0;font-size:32px;letter-spacing:-.04em}.card{margin:16px 0;padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(22px)}h2{margin:0 0 16px;font-size:20px;letter-spacing:-.02em}.hint{margin:-8px 0 18px;color:var(--muted);font-size:14px}.row{display:flex;gap:16px}.field{flex:1}label{display:block;margin:0 0 7px;color:var(--muted);font-size:13px;font-weight:600}input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #007aff2e}button{padding:10px 16px;border:0;border-radius:11px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s,opacity .15s}button:hover{opacity:.86;transform:translateY(-1px)}button:disabled{cursor:wait;opacity:.55}.form-actions{display:flex;justify-content:flex-end;margin-top:16px}.secondary{background:transparent;color:var(--blue);border:1px solid var(--blue)}.danger{background:transparent;color:var(--red);border:1px solid #ff3b3066}.user-list{display:grid;gap:10px;margin-top:16px}.user{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 15px;border:1px solid var(--line);border-radius:14px}.user-info strong{display:block;font-size:15px}.user-info span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.user-actions{display:flex;gap:7px}.badge{display:inline-block;margin-left:7px;padding:3px 8px;border-radius:999px;background:#34c75924;color:var(--green);font-size:11px;font-weight:700}.badge.disabled{background:#ff3b3024;color:var(--red)}#result{display:none;margin-top:18px;padding:14px;border-radius:13px;background:#007aff12;color:var(--text);white-space:pre-wrap;word-break:break-word;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}#result:not(:empty){display:block}.token-label{display:block;margin-bottom:5px;color:var(--blue);font:600 11px system-ui;text-transform:uppercase;letter-spacing:.08em}
@media(max-width:620px){.shell{padding:28px 14px 50px}.card{padding:18px;border-radius:17px}.row{display:grid;gap:12px}.user{align-items:flex-start;flex-direction:column}.user-actions{width:100%}.user-actions button{flex:1}.brand h1{font-size:27px}}
</style></head>
<body><div class="shell"><header class="brand"><div class="brand-icon">✉</div><div><p class="eyebrow">Mail Tracker</p><h1>Admin Center</h1></div></header>
<section class="card"><h2>Sign in</h2><p class="hint">Use the deployment administrator account to manage user access.</p><form id="login"><div class="row"><div class="field"><label for="admin-user">Username</label><input id="admin-user" autocomplete="username" required></div><div class="field"><label for="admin-pass">Password</label><input id="admin-pass" type="password" autocomplete="current-password" required></div></div><div class="form-actions"><button>Sign in</button></div></form></section>
<section id="panel" class="card" hidden><h2>User access</h2><p class="hint">Create a user and copy the token immediately. Tokens are shown only once.</p><form id="create"><div class="row"><div class="field"><label for="new-user">Username</label><input id="new-user" pattern="[A-Za-z0-9_.@-]+" placeholder="e.g. edu-user" required></div><div class="form-actions"><button>Create user</button></div></div></form><div id="result"></div><div id="users" class="user-list"></div><div class="form-actions"><button id="refresh" class="secondary" type="button">Refresh list</button></div></section></div>
<script>let auth="";const $=id=>document.getElementById(id);function result(text){$("result").textContent=text}async function api(path,options={}){const response=await fetch(path,{...options,headers:{...(options.headers||{}),Authorization:auth,"Content-Type":"application/json"}});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.detail||`HTTP ${response.status}`);return data}$("login").addEventListener("submit",async e=>{e.preventDefault();auth="Basic "+btoa($("admin-user").value+":"+$("admin-pass").value);try{await api("/api/admin/users");$("panel").hidden=false;result("Signed in successfully.");loadUsers()}catch(error){auth="";result(error.message)}});$("create").addEventListener("submit",async e=>{e.preventDefault();try{const data=await api("/api/admin/users",{method:"POST",body:JSON.stringify({username:$("new-user").value})});result(`User: ${data.username}\n\nToken (copy now):\n${data.token}`);$("new-user").value="";loadUsers()}catch(error){result(error.message)}});async function loadUsers(){try{$("users").replaceChildren();(await api("/api/admin/users")).forEach(user=>{const item=document.createElement("div");item.className="user";const info=document.createElement("div");info.className="user-info";const name=document.createElement("strong");name.textContent=user.username;const badge=document.createElement("span");badge.className=`badge ${user.disabled?"disabled":""}`;badge.textContent=user.disabled?"Disabled":"Active";name.append(badge);const date=document.createElement("span");date.textContent=`Created ${new Date(user.created_at).toLocaleString()}`;info.append(name,date);const actions=document.createElement("div");actions.className="user-actions";if(!user.disabled){const reset=document.createElement("button");reset.className="secondary";reset.textContent="Reset token";reset.onclick=async()=>{try{const data=await api(`/api/admin/users/${user.id}/reset-token`,{method:"POST"});result(`User: ${data.username}\n\nNew token (copy now):\n${data.token}`)}catch(error){result(error.message)}};const disable=document.createElement("button");disable.className="danger";disable.textContent="Disable";disable.onclick=async()=>{try{await api(`/api/admin/users/${user.id}`,{method:"DELETE"});loadUsers()}catch(error){result(error.message)}};actions.append(reset,disable)}item.append(info,actions);$("users").append(item)})}catch(error){result(error.message)}}$("refresh").addEventListener("click",loadUsers)</script></body></html>
