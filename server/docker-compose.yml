services:
  tracker-api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_PATH: /data/tracker.db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-jjboy}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in server/.env}
      FINGERPRINT_SALT: ${FINGERPRINT_SALT:?Set FINGERPRINT_SALT in server/.env}
    volumes:
      - tracker_data:/data
    restart: unless-stopped

volumes:
  tracker_data:
